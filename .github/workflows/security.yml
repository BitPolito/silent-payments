name: Dependency security
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --strict --requirement api/requirements-dev.txt
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file native/vanity/Cargo.lock
